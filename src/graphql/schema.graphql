# Import all schema files
# This is the main schema file used by the Relay compiler

# Recipe schema
scalar DateTime

type Recipe {
  id: ID!
  name: String!
  description: String!
  category: String!
  isPublished: Boolean!
  mediaUrl: String!
  uploadDate: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  ingredients: [String!]
  instructions: [String!]
}

input CreateRecipeInput {
  name: String!
  description: String!
  category: String!
  mediaUrl: String!
  ingredients: [String!]
  instructions: [String!]
}

input UpdateRecipeInput {
  name: String
  description: String
  category: String
  mediaUrl: String
  isPublished: Boolean
  ingredients: [String!]
  instructions: [String!]
}

type Query {
  recipes(
    category: String
    status: String
    search: String
    sort: String
  ): [Recipe!]!
  recipe(id: ID!): Recipe
}

type Mutation {
  createRecipe(input: CreateRecipeInput!): Recipe!
  updateRecipe(id: ID!, input: UpdateRecipeInput!): Recipe!
  deleteRecipe(id: ID!): DeleteRecipeResponse!
  toggleRecipeStatus(id: ID!): Recipe!
}

type DeleteRecipeResponse {
  success: Boolean!
}

