# Import all schema files
# This is the main schema file used by the Relay compiler

# Recipe schema
scalar DateTime

type Recipe {
  id: ID!
  name: String!
  description: String!
  category: String!
  isPublished: Boolean!
  mediaUrl: String!
  uploadDate: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  ingredients: [String!]
  instructions: [String!]
}

input CreateRecipeInput {
  name: String!
  description: String!
  category: String!
  mediaUrl: String!
  ingredients: [String!]
  instructions: [String!]
}

input UpdateRecipeInput {
  name: String
  description: String
  category: String
  mediaUrl: String
  isPublished: Boolean
  ingredients: [String!]
  instructions: [String!]
}

# Product schema
type Product {
  id: ID!
  name: String!
  description: String!
  photoUrl: String!
  videoUrl: String
  price: Float!
  category: String!
  tags: [String!]!
  inventory: Int!
  isActive: Boolean!
  stripeProductId: String
  stripePriceId: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateProductInput {
  name: String!
  description: String!
  photoUrl: String!
  videoUrl: String
  price: Float!
  category: String!
  tags: [String!]!
  inventory: Int
}

input UpdateProductInput {
  name: String
  description: String
  photoUrl: String
  videoUrl: String
  price: Float
  category: String
  tags: [String!]
  inventory: Int
  isActive: Boolean
}

type Query {
  # Recipe queries
  recipes(
    category: String
    status: String
    search: String
    sort: String
  ): [Recipe!]!
  recipe(id: ID!): Recipe

  # Product queries
  products(
    category: String
    status: String
    search: String
    sort: String
  ): [Product!]!
  product(id: ID!): Product
}

type Mutation {
  # Recipe mutations
  createRecipe(input: CreateRecipeInput!): Recipe!
  updateRecipe(id: ID!, input: UpdateRecipeInput!): Recipe!
  deleteRecipe(id: ID!): DeleteRecipeResponse!
  toggleRecipeStatus(id: ID!): Recipe!

  # Product mutations
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  deleteProduct(id: ID!): DeleteProductResponse!
  toggleProductStatus(id: ID!): Product!
}

type DeleteRecipeResponse {
  success: Boolean!
}

type DeleteProductResponse {
  success: Boolean!
}

